server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Spring Data JPA & H2 Database
spring.datasource.url=jdbc:h2:file:./data/sudokudb;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Jackson JSON
spring.jackson.deserialization.fail-on-unknown-properties=false

# Expose ResponseStatusException reasons (e.g. "Room is full.") to API clients
server.error.include-message=always

# Machine Learning FastAPI Service
ml.api.url=${ML_API_URL:http://localhost:8000}
