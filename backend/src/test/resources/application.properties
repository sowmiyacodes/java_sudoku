# Test configuration using in-memory H2 database to avoid file locking during test suites
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable H2 console during test runs
spring.h2.console.enabled=false

# Expose error messages
server.error.include-message=always

# ML Service URL for tests
ml.api.url=${ML_API_URL:http://localhost:8000}
